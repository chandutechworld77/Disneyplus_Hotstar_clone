name: deploy-nodejs-ecs-fargate

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  ECR_REPOSITORY: ${{ vars.ECR_REPO }}

  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

  TASK_DEFINITION_FILE: .aws/task-definition.json
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Ensure ECR Repository Exists
        run: |
          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ECR exists"
          else
            echo "Creating ECR..."
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --region "$AWS_REGION"
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: image
        run: |
          echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ steps.image.outputs.image_tag }} .

      - name: Tag Docker Image
        run: |
          docker tag \
          $ECR_REPOSITORY:${{ steps.image.outputs.image_tag }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ steps.image.outputs.image_tag }}

      - name: Push Docker Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ steps.image.outputs.image_tag }}

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: dev
    needs: build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Ensure ECS Cluster Exists
        run: |
          STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query "clusters[0].status" \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$STATUS" = "ACTIVE" ]; then
            echo "Cluster exists"
          else
            echo "Creating ECS Cluster..."
            aws ecs create-cluster \
              --cluster-name "$ECS_CLUSTER" \
              --region "$AWS_REGION"
          fi

      - name: Verify Task Definition File
        run: |
          if [ ! -f "$TASK_DEFINITION_FILE" ]; then
            echo "Task definition file not found"
            exit 1
          fi

      - name: Render ECS Task Definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}

      - name: Verify ECS Service Exists
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS Service not found."
            echo "Create the ECS Service once before deploying."
            exit 1
          fi

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
